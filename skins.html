<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>متجر الاسكنات - PUBG UC FREE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #0a0f1f;
    font-family: 'Cairo', sans-serif;
    color: white;
    padding: 20px;
}

.header {
    text-align: center;
    padding: 25px;
    background: linear-gradient(90deg, #FFD700, #FFA500);
    color: black;
    border-radius: 20px;
    margin-bottom: 30px;
    box-shadow: 0 0 30px rgba(255,215,0,0.5);
}
.header h1 { 
    font-family: 'Anton', sans-serif;
    font-size: 40px; 
    font-weight: 900;
    text-shadow: 0 0 10px rgba(0,0,0,0.3);
}
.header p { font-size: 16px; font-weight: bold; }

.logout { 
    position: fixed; top: 20px; left: 20px; 
    background: linear-gradient(90deg, #ff0000, #cc0000); 
    color: white; border: none; 
    padding: 12px 20px; border-radius: 12px; 
    cursor: pointer; font-weight: bold;
    z-index: 10;
    transition: 0.3s;
}
.logout:hover { transform: scale(1.05); box-shadow: 0 0 15px red; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
}

.card {
    background: linear-gradient(180deg, rgba(10,15,30,0.9), rgba(0,0,0,0.9));
    border: 2px solid #FFD700;
    border-radius: 20px;
    padding: 15px;
    text-align: center;
    transition: 0.3s;
    backdrop-filter: blur(10px);
}
.card:hover { 
    transform: translateY(-5px); 
    box-shadow: 0 0 30px rgba(255,215,0,0.6); 
    border-color: #FFA500;
}
.card img { 
    width: 100%; 
    height: 200px;
    object-fit: cover;
    border-radius: 15px; 
    border: 1px solid #FFD700;
}
.card h3 { 
    margin: 15px 0 5px; 
    color: #FFD700; 
    font-size: 20px;
    font-weight: 900;
}
.card p { color: #ccc; margin-bottom: 15px; }

.card button {
    background: linear-gradient(90deg, #FFD700, #FFA500); 
    color: black; 
    border: none;
    padding: 12px 20px; 
    border-radius: 12px;
    font-weight: 900; 
    cursor: pointer; 
    width: 100%;
    font-size: 16px;
    font-family: 'Cairo';
    transition: 0.3s;
}
.card button:hover { 
    box-shadow: 0 0 20px #FFD700; 
    transform: scale(1.02);
}
</style>
</head>
<body>
<button class="logout" onclick="window.location='index.html'">تسجيل خروج</button>

</div>

<script>
function claim(itemName){

    // هنا ممكن نبعت للـ API مين ضغط على ايه
}
</script>
</body>
</html>
